<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dra. Reyna Pimentel — CRM</title>
    <link rel="icon" href="/static/logo_clinica.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: {
                dental: { 50: '#e6f5f5', 100: '#b3e0e0', 200: '#80cccc', 500: '#008080', 600: '#006666', 700: '#004d4d', 900: '#003333' }
            } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        :root {
            /* Clinical Precision — Dental Blue (Stitch) */
            --primary: #1976d2; --primary-dark: #005dac; --primary-darker: #004786;
            --primary-container: #1976d2; --primary-soft: #d4e3ff; --primary-tint: #e3f2fd;
            --surface: #f3faff; --surface-low: #e6f6ff; --surface-mid: #dbf1fe; --surface-high: #d5ecf8;
            --card: #ffffff;
            --on-surface: #071e27; --on-variant: #414752; --outline: #717783; --outline-variant: #c1c6d4;
            --success: #2E7D32; --warning: #f59e0b; --error: #D32F2F;
            --bg: #f8fafc; --border: #e8edf3; --hover: #f1f5f9;
            --shadow-1: 0px 4px 12px rgba(0,0,0,0.05);
            --shadow-2: 0px 8px 24px rgba(0,0,0,0.10);
            --radius-sm: 4px; --radius: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
        }
        * { font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--on-surface); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--outline-variant); border-radius: 8px; }
        .card { background: var(--card); border-radius: var(--radius-md); box-shadow: var(--shadow-1); border: 1px solid var(--border); }
        .card-shadow { box-shadow: 0px 4px 12px rgba(0,0,0,0.05); }
        /* Metric cards — azul agresivo: gradiente sólido permanente, texto blanco */
        .metric-card { transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease; cursor: pointer; display: block; text-decoration: none; color: #fff; background: linear-gradient(135deg, #2196f3 0%, #1565c0 100%); border: 1px solid rgba(255,255,255,0.15); }
        .metric-card:hover { transform: translateY(-5px); box-shadow: 0 18px 40px rgba(21,101,192,0.45); background: linear-gradient(135deg, #1e88e5 0%, #0d47a1 100%); filter: brightness(1.05); }
        .metric-card .metric-icon { background: rgba(255,255,255,0.22); color: #fff; }
        .metric-card.alert-card { background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%); border-color: rgba(255,255,255,0.18); }
        .metric-card.alert-card:hover { box-shadow: 0 18px 40px rgba(183,28,28,0.45); background: linear-gradient(135deg, #d32f2f 0%, #8e0000 100%); }
        .metric-icon { transition: transform 0.25s ease; }
        .metric-card:hover .metric-icon { transform: scale(1.18) rotate(-6deg); }
        .stat-num { display: inline-block; }
        /* Paneles del dashboard — entrada escalonada + elevación en hover */
        .panel-card { transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease; animation: panelIn 0.55s cubic-bezier(0.22,1,0.36,1) both; }
        .panel-card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(25,118,210,0.18); border-color: var(--primary-soft); }
        @keyframes panelIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.18s; } .d3 { animation-delay: 0.32s; } .d4 { animation-delay: 0.46s; }
        .patient-row { transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease; border-radius: 10px; padding: 8px 10px; margin: 0 -10px; }
        .patient-row:hover { transform: translateX(5px); background: #f0f7ff; }
        .card-hover { cursor: pointer; background: var(--card); border-radius: var(--radius-md); box-shadow: var(--shadow-1); border: 1px solid var(--border); transition: all 0.25s; display: block; text-decoration: none; color: inherit; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--primary-soft); }
        .btn { transition: all 0.15s; }
        .btn:active { transform: scale(0.97); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        /* Sidebar — white with persistent right border, active = blue left bar + bold (Clinical Precision) */
        .sidebar-link { border-radius: 10px; padding: 11px 14px; transition: all 0.18s; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--on-variant); position: relative; }
        .sidebar-link:hover { background: var(--primary-tint); color: var(--primary-dark); }
        .sidebar-link.active { background: var(--primary-tint); color: var(--primary-dark); font-weight: 700; }
        .sidebar-link.active::before { content: ''; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 4px; background: var(--primary); }
        .side-ico { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--primary-tint); color: var(--primary); flex-shrink: 0; transition: all 0.18s; }
        .sidebar-link.active .side-ico { background: var(--primary); color: #fff; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .kpi-icon { width: 46px; height: 46px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .table-modern thead th { background: #f8fafc; color: var(--on-variant); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
        .table-modern tbody tr { transition: background 0.12s; }
        .table-modern tbody tr:hover { background: var(--hover); }
        .input-modern { width: 100%; border: 1px solid var(--outline-variant); border-radius: var(--radius-md); padding: 10px 14px; font-size: 14px; outline: none; transition: border 0.15s, box-shadow 0.15s; background: #fff; min-height: 44px; }
        .input-modern:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(25,118,210,0.15); }
        /* Mobile responsive sidebar */
        #sidebar-overlay { display: none; }
        @media (max-width: 768px) {
            #sidebar { position: fixed; left: -280px; top: 0; bottom: 0; z-index: 100; transition: left 0.25s; }
            #sidebar.open { left: 0; }
            #sidebar-overlay { display: none; position: fixed; inset: 0; z-index: 99; background: rgba(0,0,0,0.4); }
            #sidebar-overlay.show { display: block; }
            #toggle-sidebar { display: flex !important; }
            #main-content { padding-top: 3.5rem !important; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>

            <a href="/servicios" class="sidebar-link"><span class="side-ico"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span> Servicios</a>

            <a href="/bloqueo" class="sidebar-link"><span class="side-ico"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span> Bloqueo</a>

    <!-- TOGGLE BUTTON (outside main to not be replaced) -->

    <!-- FLOATING HOME BUTTON -->
    <a href="/" id="btn-home" onclick="event.preventDefault();navigateTo('/')"

    <!-- TOP NAVBAR — Clinical Precision (fiel a Stitch) -->
    <div class="flex-1 flex flex-col min-w-0 max-w-[1440px] mx-auto w-full">
    <header class="flex justify-between items-center px-4 md:px-6 w-full sticky top-0 z-40 h-16" style="background:var(--surface);border-bottom:1px solid var(--outline-variant)">
        <div class="flex items-center gap-4 flex-1">
            <button onclick="toggleSidebar()" class="md:hidden p-2 rounded-full transition-colors" style="color:var(--on-variant);background:var(--surface-low)" title="Menú">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="text-lg font-semibold md:hidden" style="color:var(--primary)">Centro Odontológico</div>
            <div class="hidden md:flex relative w-96">

                <input id="global-search" class="w-full h-10 pl-10 pr-4 rounded-lg border text-sm outline-none transition-colors" style="border-color:var(--outline-variant);background:#fff;color:var(--on-surface)" placeholder="Buscar pacientes, citas..." onkeydown="if(event.key==='Enter'){var q=this.value.trim();if(q)window.location='/pacientes?q='+encodeURIComponent(q);}">

    <!-- MAIN -->

        <div class="flex items-center justify-center h-64 text-gray-400">Cargando...</div>
    </main>

    <script>
    // ============================================================
    // STATE
    // ============================================================
    let STATE = { stats: null, patients: [], currentPatient: null, appointments: [], treatments: [] };

    const STATUS = {
        nuevo: { label: 'Nuevo', emoji: '🆕', color: '#4472C4', bg: '#eef2fa' },
        agendado: { label: 'Agendado', emoji: '📅', color: '#f59e0b', bg: '#fef3c7' },
        diagnosticado: { label: 'Diagnosticado', emoji: '🔍', color: '#8b5cf6', bg: '#f3e8ff' },
        plan_aceptado: { label: 'Plan Aceptado', emoji: '✅', color: '#3b82f6', bg: '#dbeafe' },
        en_tratamiento: { label: 'En Tratamiento', emoji: '🦷', color: '#f97316', bg: '#fff7ed' },
        completado: { label: 'Completado', emoji: '🎉', color: '#10b981', bg: '#d1fae5' },
        retorno: { label: 'Retorno', emoji: '🔄', color: '#06b6d4', bg: '#cffafe' },
        perdido: { label: 'Perdido', emoji: '😞', color: '#6b7280', bg: '#f3f4f6' },
    };
    const STATUS_KEYS = Object.keys(STATUS);

    function fmtDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleDateString('es-DO', { day: 'numeric', month: 'short' });
    }
    function fmtDateTime(iso) {
        if (!iso) return '—';
        const d = new Date(iso);
        return d.toLocaleDateString('es-DO', { day: 'numeric', month: 'short' }) + ' ' +
               d.toLocaleTimeString('es-DO', { hour: '2-digit', minute: '2-digit' });
    }
    function sBadge(status) {
        const c = STATUS[status] || STATUS.nuevo;
        return '<span class="status-badge" style="background:' + c.bg + ';color:' + c.color + '">' + c.emoji + ' ' + c.label + '</span>';
    }
    function escHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ============================================================
    // API
    // ============================================================
    async function api(url, opts) {
        var res = await fetch(url, {
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            ...(opts || {})
        });
        if (res.status === 401) { window.location = '/login'; return null; }
        if (!res.ok) { var err = await res.json().catch(function() { return {}; }); throw new Error(err.error || res.statusText); }
        return res.json();
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    function setActiveLink(path) {
        var links = document.querySelectorAll('#sidebar-nav a');
        for (var i = 0; i < links.length; i++) {
            var href = links[i].getAttribute('href');
            if (path === '/' && href === '/') links[i].classList.add('active');
            else if (path.startsWith(href) && href !== '/') links[i].classList.add('active');
            else links[i].classList.remove('active');
        }
    }

    function navigateTo(url) {
        history.pushState(null, '', url);
        setActiveLink(url.split('?')[0]);
        if (window.updateHomeButton) window.updateHomeButton();
        renderPage();
    }

    // ============================================================
    // RENDER
    // ============================================================
    async function renderPage() {
        var main = document.getElementById('main-content');
        var path = window.location.pathname;

        // Destroy existing Chart.js instances para evitar conflictos al re-renderizar
        if (typeof Chart !== 'undefined') {
            Object.keys(Chart.instances || {}).forEach(function (k) { try { Chart.instances[k].destroy(); } catch (e) { } });
        }
        // Actualizar sidebar activo según la ruta
        document.querySelectorAll('#sidebar-nav .sidebar-link').forEach(function (a) {
            var href = a.getAttribute('href');
            a.classList.remove('active');
            if (href === path || (path.indexOf('/paciente/') === 0 && href === '/pacientes')) a.classList.add('active');
        });
        // Volver arriba al cambiar de vista
        if (main) main.scrollTop = 0;
        window.scrollTo(0, 0);

        try {
            if (path === '/') {
                var stats = await api('/api/stats');
                var pData = await api('/api/patients');
                main.innerHTML = renderDashboard(stats, pData ? pData.patients.slice(0, 5) : []);
                try { var fData = await api('/api/finance/overview'); } catch (e) { var fData = null; }
                ensureChartsReady(function () { initDashboardCharts(stats, fData); });
                animateCountUp();
            } else if (path === '/pacientes') {
                var search = window.location.search;
                var data = await api('/api/patients' + search);
                var statusFilter = search.indexOf('status=') >= 0 ? search.replace('?status=', '') : null;
                main.innerHTML = renderPatients(data ? data.patients : [], statusFilter);
            } else if (path.indexOf('/paciente/') === 0) {
                var id = path.split('/')[2];
                var patient = await api('/api/patients/' + id);
                main.innerHTML = renderPatientDetail(patient);
            } else if (path === '/citas') {
                var data = await api('/api/appointments');
                main.innerHTML = renderAppointments(data ? data.appointments : []);
            } else if (path === '/tratamientos') {
                var data = await api('/api/treatments');
                main.innerHTML = renderTreatments(data ? data.treatments : []);
            } else if (path === '/recall') {
                var data = await api('/api/recall');
                main.innerHTML = renderRecall(data ? data.recalls : []);
            } else if (path === '/reportes') {
                var stats = await api('/api/stats');
                try { var fData = await api('/api/finance/overview'); } catch (e) { var fData = null; }
                main.innerHTML = renderReports(stats, fData);
                ensureChartsReady(function () { initReportsCharts(stats, fData); });
            } else if (path === '/servicios') {
                var data = await api('/api/services');
                main.innerHTML = renderServices(data ? data.services : []);
            } else if (path === '/finanzas') {
                main.innerHTML = '<div class="fade-in" id="finanzas-root"><div class="text-center py-16 text-gray-400">Cargando...</div></div>';
                renderFinanzas();
            } else if (path === '/doctores') {
                var data = await api('/api/doctors');
                main.innerHTML = renderDoctors(data ? data.doctors : []);
            } else if (path === '/bloqueo') {
                var data = await api('/api/blocked-schedules');
                var docs = await api('/api/doctors');
                main.innerHTML = renderBloqueo(data ? data.blocked : [], docs ? docs.doctors : []);
            } else {
                main.innerHTML = '<div class="text-center py-16 text-gray-400">Página no encontrada</div>';
            }
        } catch (e) {
            main.innerHTML = '<div class="text-red-500 p-8 text-center text-lg">Error: ' + e.message + '</div>';
        }
    }

    function initDashboardCharts(stats, finance) {
        var estadoEl = document.getElementById('chart-estado');
        var ingresosEl = document.getElementById('chart-ingresos');
        if (!estadoEl || !ingresosEl || typeof Chart === 'undefined') return;

        // Donut 3D — distribución por estado del care cycle (relieve radial + hover expand)
        var bs = stats.by_status || {};
        var estadoMap = {
            nuevo: { label: 'Nuevo', color: '#1976d2' },
            agendado: { label: 'Agendado', color: '#f59e0b' },
            diagnosticado: { label: 'Diagnosticado', color: '#8b5cf6' },
            plan_aceptado: { label: 'Plan Aceptado', color: '#0288d1' },
            en_tratamiento: { label: 'En Tratamiento', color: '#f97316' },
            completado: { label: 'Completado', color: '#2E7D32' },
            retorno: { label: 'Retorno', color: '#06b6d4' },
            perdido: { label: 'Perdido', color: '#94a3b8' }
        };
        var labels = [], data = [], colors = [];
        for (var k in estadoMap) {
            if ((bs[k] || 0) > 0) { labels.push(estadoMap[k].label); data.push(bs[k]); colors.push(estadoMap[k].color); }
        }
        if (labels.length === 0) { labels = ['Sin datos']; data = [1]; colors = ['#e2e8f0']; }
        new Chart(estadoEl, {
            type: 'doughnut',
            data: { labels: labels, datasets: [{ data: data, backgroundColor: function (ctx) { return radialGrad(ctx, colors[ctx.dataIndex]); }, hoverBackgroundColor: function (ctx) { return lightenHex(colors[ctx.dataIndex], 25); }, borderWidth: 2, borderColor: '#fff', hoverOffset: 14 }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '58%', animation: { animateRotate: true, animateScale: true, duration: 1200, easing: 'easeOutQuart' }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, boxHeight: 12, font: { size: 11 }, padding: 14, usePointStyle: true, pointStyle: 'circle' } } } }
        });

        // Bar 3D — ingresos por mes (gradiente columna + entrada escalonada con rebote)
        var monthly = (finance && finance.monthly) || [];
        var m6 = monthly.slice(-6);
        var meses = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        var mLabels = m6.map(function (m) { var p = parseInt(m.month.slice(5, 7), 10) - 1; return meses[p] + ' ' + m.month.slice(2, 4); });
        var mData = m6.map(function (m) { return m.income || 0; });
        new Chart(ingresosEl, {
            type: 'bar',
            data: { labels: mLabels, datasets: [{ label: 'Ingresos (RD$)', data: mData, backgroundColor: function (ctx) { return barGrad(ctx, '#64b5f6', '#0d47a1'); }, hoverBackgroundColor: function (ctx) { return barGrad(ctx, '#90caf9', '#1976d2'); }, borderRadius: 8, borderSkipped: false, maxBarThickness: 46 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, animation: { duration: 1300, easing: 'easeOutBounce', delay: function (ctx) { return ctx.dataIndex * 140; } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(148,163,184,0.12)' }, ticks: { font: { size: 10 }, callback: function (v) { return v >= 1000 ? (v / 1000) + 'k' : v; } } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } } }
        });
    }

    // ============================================================
    // CHART 3D HELPERS — gradientes de profundidad y luz
    // ============================================================
    function barGrad(ctx, topColor, bottomColor) {
        var c = ctx.chart.ctx;
        var area = ctx.chart.chartArea;
        if (!area) return topColor;
        var g = c.createLinearGradient(0, area.top, 0, area.bottom);
        g.addColorStop(0, topColor);
        g.addColorStop(1, bottomColor);
        return g;
    }
    function radialGrad(ctx, baseColor) {
        var c = ctx.chart.ctx;
        var meta = ctx.chart.getDatasetMeta(0);
        if (!meta || !meta.data || !meta.data[ctx.dataIndex]) return baseColor;
        var arc = meta.data[ctx.dataIndex];
        var cx = arc.x, cy = arc.y, ro = arc.outerRadius, ri = arc.innerRadius;
        if (!cx || !cy || !ro) return baseColor;
        var g = c.createRadialGradient(cx - ro * 0.25, cy - ro * 0.25, ri, cx, cy, ro);
        g.addColorStop(0, lightenHex(baseColor, 28));
        g.addColorStop(0.55, baseColor);
        g.addColorStop(1, darkenHex(baseColor, 28));
        return g;
    }
    function lightenHex(hex, amt) {
        var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        r = Math.min(255, r + Math.round((255 - r) * amt / 100)); g = Math.min(255, g + Math.round((255 - g) * amt / 100)); b = Math.min(255, b + Math.round((255 - b) * amt / 100));
        return '#' + [r, g, b].map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
    }
    function darkenHex(hex, amt) {
        var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        r = Math.max(0, r - Math.round(r * amt / 100)); g = Math.max(0, g - Math.round(g * amt / 100)); b = Math.max(0, b - Math.round(b * amt / 100));
        return '#' + [r, g, b].map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
    }
    // Count-up animado para las metric cards
    function animateCountUp() {
        var els = document.querySelectorAll('.stat-num');
        Array.prototype.forEach.call(els, function (el) {
            var target = parseFloat(el.getAttribute('data-target') || '0');
            var dur = 900, start = null;
            function step(ts) {
                if (!start) start = ts;
                var p = Math.min((ts - start) / dur, 1);
                var eased = 1 - Math.pow(1 - p, 3);
                el.textContent = Math.round(target * eased).toLocaleString('es-DO');
                if (p < 1) requestAnimationFrame(step);
            }
            requestAnimationFrame(step);
        });
    }

    function fmtTime(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleTimeString('es-DO', { hour: '2-digit', minute: '2-digit' });
    }

    // ============================================================
    // NOTIFICATIONS — campana con acción (datos reales)

    var notifLoaded = false;
    function toggleNotifications(ev) {
        if (ev) ev.stopPropagation();

            panel.classList.add('hidden');
        }
    }
    document.addEventListener('click', function (ev) {
        var panel = document.getElementById('notif-panel');
        if (panel && !panel.classList.contains('hidden') && !ev.target.closest('#notif-panel') && !ev.target.closest('button[title="Notificaciones"]')) {
            panel.classList.add('hidden');
        }
    });
    async function loadNotifications() {
        var list = document.getElementById('notif-list');
        var countEl = document.getElementById('notif-count');
        if (!list) return;
        try {
            var s = await api('/api/stats');
            var items = [];
            if ((s.today_appointments || 0) > 0) items.push({ icon: '📅', text: (s.today_appointments) + ' cita(s) hoy programadas', sub: 'Revisa la agenda del día', link: '/citas' });
            if ((s.recall_due || 0) > 0) items.push({ icon: '🔄', text: (s.recall_due) + ' paciente(s) en recall pendiente', sub: 'Requieren contacto de retorno', link: '/recall' });
            if ((s.plans_pending || 0) > 0) items.push({ icon: '📋', text: (s.plans_pending) + ' plan(es) de tratamiento sin aceptar', sub: 'Seguimiento de presupuestos', link: '/tratamientos' });
            if ((s.today_new || 0) > 0) items.push({ icon: '🆕', text: (s.today_new) + ' paciente(s) nuevo(s) hoy', sub: 'Captación del día', link: '/pacientes?hoy=true' });
            if ((s.active_treatments || 0) > 0) items.push({ icon: '🦷', text: (s.active_treatments) + ' tratamiento(s) en progreso', sub: 'Ciclo de cuidado activo', link: '/tratamientos' });
            if (items.length === 0) {
                list.innerHTML = '<div class="p-6 text-center"><div class="text-2xl mb-1">✅</div><p class="text-sm" style="color:var(--on-variant)">Todo al día, sin pendientes</p></div>';
                countEl.textContent = '0';
            } else {
                countEl.textContent = items.length + ' pendiente(s)';
                list.innerHTML = items.map(function (it) {
                    return '<a href="' + it.link + '" class="flex items-start gap-3 px-4 py-3 hover:bg-[#f5faff] transition-colors no-underline" style="color:inherit">' +
                        '<div class="w-8 h-8 rounded-full flex items-center justify-center text-sm flex-shrink-0" style="background:var(--primary-tint)">' + it.icon + '</div>' +
                        '<div class="min-w-0"><div class="text-sm font-medium" style="color:var(--on-surface)">' + it.text + '</div>' +
                        '<div class="text-xs" style="color:var(--on-variant)">' + it.sub + '</div></div></a>';
                }).join('');
            }
            notifLoaded = true;
        } catch (e) {
            list.innerHTML = '<div class="p-4 text-center text-sm" style="color:var(--error)">Error al cargar notificaciones</div>';
        }
    }

                container.innerHTML = '<p class="text-gray-400 text-sm">Sin conversaciones registradas</p>';
                return;

            var h = '';
            for (var i = 0; i < ix.length; i++) {

                h += '<div class="border-l-2 border-gray-200 pl-4 py-2">';

                    h += '<div class="bg-blue-50 rounded-lg px-3 py-2 text-sm">';

    function initReportsCharts(stats, finance) {
        var estadoEl = document.getElementById('report-chart-estado');
        var serviciosEl = document.getElementById('report-chart-servicios');
        if (!estadoEl || !serviciosEl || typeof Chart === 'undefined') return;

        // Donut 3D — pacientes por estado (relieve radial + hover expand)
        var bs = stats.by_status || {};
        var estadoMap = {
            nuevo: { label: 'Nuevo', color: '#1976d2' },

            diagnosticado: { label: 'Diagnosticado', color: '#8b5cf6' },

            en_tratamiento: { label: 'En Tratamiento', color: '#f97316' },

            retorno: { label: 'Retorno', color: '#06b6d4' },
            perdido: { label: 'Perdido', color: '#94a3b8' }
        };
        var labels = [], data = [], colors = [];
        for (var k in estadoMap) {
            if ((bs[k] || 0) > 0) { labels.push(estadoMap[k].label); data.push(bs[k]); colors.push(estadoMap[k].color); }
        }
        if (labels.length === 0) { labels = ['Sin datos']; data = [1]; colors = ['#e2e8f0']; }
        new Chart(estadoEl, {
            type: 'doughnut',
            data: { labels: labels, datasets: [{ data: data, backgroundColor: function (ctx) { return radialGrad(ctx, colors[ctx.dataIndex]); }, hoverBackgroundColor: function (ctx) { return lightenHex(colors[ctx.dataIndex], 25); }, borderWidth: 2, borderColor: '#fff', hoverOffset: 14 }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '58%', animation: { animateRotate: true, animateScale: true, duration: 1200, easing: 'easeOutQuart' }, plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, boxHeight: 12, font: { size: 11 }, padding: 12, usePointStyle: true, pointStyle: 'circle' } } } }

        var sLabels = byService.map(function (x) { return x.service.length > 24 ? x.service.slice(0, 22) + '…' : x.service; });

        new Chart(serviciosEl, {

        });
    }

    function exportReportPDF() {
        var html = window._reportHTML || '';
        if (!html) { alert('Primero genera el reporte'); return; }
        html = html.replace(/src="\/static\/logo_clinica\.jpg"/g, 'src="' + window.location.origin + '/static/logo_clinica.jpg"');
        // Reemplazar canvases dibujados por imágenes (un canvas vacío no imprime nada)
        var chartIds = ['report-preview-chart-estado', 'report-preview-chart-daily'];
        for (var i = 0; i < chartIds.length; i++) {
            var c = document.getElementById(chartIds[i]);
            if (c && typeof c.toDataURL === 'function') {
                try {
                    // Duplicar resolución para impresión nítida
                    var tmp = document.createElement('canvas');
                    tmp.width = (c.width || 800) * 2;
                    tmp.height = (c.height || 220) * 2;
                    var tctx = tmp.getContext('2d');
                    tctx.drawImage(c, 0, 0, tmp.width, tmp.height);
                    var imgTag = '<img src="' + tmp.toDataURL('image/png') + '" style="width:100%;height:auto;display:block;margin:0 auto;max-height:280px;object-fit:contain">';
                    html = html.replace('<canvas id="' + chartIds[i] + '"></canvas>', imgTag);
                } catch (e) { }
            }
        }
        var win = window.open('', '_blank');
        win.document.write('<html><head><title>Reporte Clínica Dental</title>');
        win.document.write('<style>body{font-family:Inter,sans-serif;padding:40px;color:#1f2937;max-width:800px;margin:0 auto}table{width:100%;border-collapse:collapse}th{background:#f9fafb;text-align:left;padding:10px 14px;border-bottom:2px solid #e5e7eb;color:#6b7280;font-size:11px;text-transform:uppercase}td{padding:10px 14px;border-bottom:1px solid #f3f4f6;font-size:13px}@media print{body{padding:20px}@page{margin:1.5cm}}</style></head><body>');
        win.document.write(html);
        win.document.write('</body></html>');
        win.document.close();
        win.focus();
        setTimeout(function() { win.print(); }, 800);
    }

    function exportReportMD() {
        var data = window._reportData;
        if (!data) { alert('Primero genera el reporte'); return; }
        var cfg = data.config?.clinica || {};
        var res = data.resumen || {};
        var lines = ['# ' + (cfg.nombre || 'Clínica Dental'), '**' + (cfg.eslogan || '') + '**', '',
            '**Reporte:** ' + new Date().toLocaleDateString('es-DO', { day:'numeric', month:'long', year:'numeric' }),
            '**Período:** ' + getPeriodLabel(parseInt(document.getElementById('r-period').value)), '',
            '## Resumen', '', '| Métrica | Valor |', '|---|---|', '| Total pacientes | ' + (res.total || 0) + ' |'];
        var bs = res.por_estado || {};
        for (var k in bs) { lines.push('| ' + (STATUS[k]?.emoji || '') + ' ' + (STATUS[k]?.label || k) + ' | ' + bs[k] + ' |'); }
        lines.push('| Citas | ' + (res.citas || 0) + ' |');
        lines.push('| Ingresos | $' + (res.ingresos || 0).toLocaleString() + ' |');
        lines.push('---', '*Generado por CRM Dra. Reyna Pimentel*');
        var blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'reporte_clinica.md';
        a.click(); URL.revokeObjectURL(url);
    }

    var finanzasChart1 = null, finanzasChart2 = null;
    function buildFinanzas(root, data, pending) {
        var fmt = new Intl.NumberFormat('es-DO', { style: 'currency', currency: 'DOP', minimumFractionDigits: 0 });
        var html = '<div class="fade-in">';
        html += '<div class="flex justify-between items-center mb-6">';
        html += '<h2 class="text-2xl font-bold text-gray-900">💰 Finanzas</h2>';
        html += '<span class="text-sm text-gray-500">' + new Date().toLocaleDateString('es-DO', { weekday: 'long', day: 'numeric', month: 'long' }) + '</span>';
        html += '</div>';

        // Summary cards
        html += '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">';
        html += summaryCard('💰 Total Ingresos', fmt.format(data.total_income), 'text-green-600', 'bg-green-50');
        html += summaryCard('📅 Este Mes', fmt.format(data.month_income), 'text-blue-600', 'bg-blue-50');
        html += summaryCard('⏳ Pendiente Cobro', fmt.format(data.pending_balance), 'text-orange-600', 'bg-orange-50');
        html += summaryCard('✅ Trat. Completados', data.completed_treatments.toString(), 'text-teal-600', 'bg-teal-50');
        html += '</div>';

        // Charts row
        html += '<div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">';
        html += '<div class="card p-4"><h3 class="font-bold text-gray-800 mb-3">📊 Ingresos Mensuales</h3><canvas id="chart-monthly" height="200"></canvas></div>';
        html += '<div class="card p-4"><h3 class="font-bold text-gray-800 mb-3">🏆 Ingresos por Servicio</h3><canvas id="chart-services" height="200"></canvas></div>';
        html += '</div>';

        // Pending payments table
        html += '<div class="card p-4">';
        html += '<h3 class="font-bold text-gray-800 mb-3">⏳ Pendientes de Cobro</h3>';
        if (pending.length === 0) {
            html += '<p class="text-gray-400 text-center py-6">No hay pagos pendientes 🎉</p>';
        } else {
            html += '<div class="overflow-x-auto"><table class="w-full text-sm">';
            html += '<thead><tr class="text-left text-gray-500 border-b">';
            html += '<th class="pb-2">Paciente</th><th class="pb-2">Tratamiento</th><th class="pb-2 text-right">Total</th><th class="pb-2 text-right">Pagado</th><th class="pb-2 text-right">Balance</th><th class="pb-2">Estado</th>';
            html += '</tr></thead><tbody>';
            for (var i = 0; i < pending.length; i++) {
                var p = pending[i];
                html += '<tr class="border-b border-gray-50 hover:bg-gray-50">';
                html += '<td class="py-2"><a href="/paciente/' + p.patient_id + '" class="text-blue-600 hover:underline" onclick="event.preventDefault();navigateTo(\'/paciente/' + p.patient_id + '\')">' + escHtml(p.patient_name) + '</a></td>';
                html += '<td class="py-2">' + escHtml(p.title || '—') + '</td>';
                html += '<td class="py-2 text-right">' + fmt.format(p.amount) + '</td>';
                html += '<td class="py-2 text-right">' + fmt.format(p.amount_paid) + '</td>';
                html += '<td class="py-2 text-right font-semibold text-orange-600">' + fmt.format(p.balance) + '</td>';
                html += '<td class="py-2">' + sBadge(p.status) + '</td>';
                html += '</tr>';
            }
            html += '</tbody></table></div>';
        }
        html += '</div>';

        root.innerHTML = html;

        // Build charts
        // Monthly
        var months = data.monthly || [];
        if (window.finanzasChart1) { window.finanzasChart1.destroy(); }
        var ctx1 = document.getElementById('chart-monthly');
        if (ctx1) {
            window.finanzasChart1 = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: months.map(function(m) { return m.month; }),
                    datasets: [{
                        label: 'Ingresos',
                        data: months.map(function(m) { return m.income; }),
                        backgroundColor: '#008080',
                        borderRadius: 6,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { callback: function(v) { return '$' + (v/1000).toFixed(0) + 'k'; } } }
                    }
                }
            });
        }

        // By service
        var svc = data.by_service || [];
        var colors = ['#008080', '#4472C4', '#f59e0b', '#8b5cf6', '#10b981', '#ef4444', '#ec4899', '#f97316'];
        if (window.finanzasChart2) { window.finanzasChart2.destroy(); }
        var ctx2 = document.getElementById('chart-services');

            window.finanzasChart2 = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: svc.map(function(s) { return s.service || '—'; }),
                    datasets: [{
                        data: svc.map(function(s) { return s.income; }),
                        backgroundColor: colors.slice(0, svc.length),

                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { size: 11 } } }
                    }
                }
            });
        }
    }

        html += '<h3 class="text-lg font-bold mb-4" id="doctor-modal-title">Nuevo Doctor</h3>';
        html += '<div class="space-y-3">';
        html += '<input id="doc-name" class="w-full border rounded-xl px-4 py-2 text-sm" placeholder="Nombre completo">';
        html += '<input id="doc-specialty" class="w-full border rounded-xl px-4 py-2 text-sm" placeholder="Especialidad">';
        html += '<textarea id="doc-bio" class="w-full border rounded-xl px-4 py-2 text-sm" placeholder="Biografía (opcional)" rows="2"></textarea>';
        html += '</div>';
        html += '<div class="flex gap-3 mt-4">';
        html += '<button onclick="closeDoctorModal()" class="flex-1 py-2 border rounded-full text-sm">Cancelar</button>';
        html += '<button onclick="saveDoctor()" class="flex-1 py-2 bg-teal-600 text-white rounded-full text-sm font-semibold">Guardar</button>';
        html += '</div></div></div>';

        return html;
    }

    window.showDoctorModal = function(id) {
        var modal = document.getElementById('doctor-modal');
        document.getElementById('doc-name').value = '';
        document.getElementById('doc-specialty').value = '';
        document.getElementById('doc-bio').value = '';
        var title = document.getElementById('doctor-modal-title');
        var editing = null;
        if (id && window._doctors) {
            for (var i = 0; i < window._doctors.length; i++) {
                if (window._doctors[i].id === id) { editing = window._doctors[i]; break; }
            }
        }
        if (editing) {
            document.getElementById('doc-name').value = editing.name || '';
            document.getElementById('doc-specialty').value = editing.specialty || '';
            document.getElementById('doc-bio').value = editing.bio || '';
            if (title) title.textContent = 'Editar Doctor';
            document.getElementById('doctor-modal').setAttribute('data-edit-id', id);
        } else {
            if (title) title.textContent = 'Nuevo Doctor';
            document.getElementById('doctor-modal').removeAttribute('data-edit-id');
        }
        modal.style.display = 'flex';
    };
    window.closeDoctorModal = function() {
        document.getElementById('doctor-modal').style.display = 'none';
    };
    window.saveDoctor = async function() {
        var name = document.getElementById('doc-name').value.trim();
        if (!name) { alert('El nombre es obligatorio'); return; }
        var payload = {
            name: name,
            specialty: document.getElementById('doc-specialty').value.trim(),
            bio: document.getElementById('doc-bio').value.trim(),
        };
        var editId = document.getElementById('doctor-modal').getAttribute('data-edit-id');
        if (editId) {
            await api('/api/doctors/' + editId, { method: 'PUT', body: JSON.stringify(payload) });
        } else {
            await api('/api/doctors', { method: 'POST', body: JSON.stringify(payload) });
        }
        closeDoctorModal();
        renderPage();
    };
    window.deleteDoctor = async function(id) {
        if (!confirm('¿Eliminar este doctor?')) return;
        await api('/api/doctors/' + id, { method: 'DELETE' });
        renderPage();
    };

    // ============================================================
    // BLOQUEO DE HORARIOS
    // ============================================================
    function renderBloqueo(blocked, doctors) {
        var today = new Date().toISOString().split('T')[0];
        var html = '<div class="fade-in">';
        html += '<div class="flex justify-between items-center mb-6">';
        html += '<h2 class="text-2xl font-bold text-gray-900">🔒 Bloqueo de Horarios</h2>';
        html += '<button onclick="showBloqueoModal()" class="px-4 py-2 bg-teal-600 text-white text-sm font-semibold rounded-full hover:bg-teal-700">+ Bloquear</button>';
        html += '</div>';

        html += '<div class="card p-4 mb-6">';
        html += '<h3 class="font-bold text-gray-800 mb-2">Nuevo bloqueo</h3>';
        html += '<div class="grid grid-cols-2 md:grid-cols-5 gap-3 items-end">';
        html += '<div><label class="text-xs text-gray-500">Doctor</label><select id="bl-doctor" class="w-full border rounded-xl px-3 py-2 text-sm">';
        html += '<option value="">Toda la clínica</option>';
        for (var i = 0; i < doctors.length; i++) {
            html += '<option value="' + doctors[i].id + '">' + escHtml(doctors[i].name) + '</option>';
        }
        html += '</select></div>';
        html += '<div><label class="text-xs text-gray-500">Fecha</label><input type="date" id="bl-date" min="' + today + '" class="w-full border rounded-xl px-3 py-2 text-sm"></div>';
        html += '<div><label class="text-xs text-gray-500">Desde</label><input type="time" id="bl-from" class="w-full border rounded-xl px-3 py-2 text-sm"></div>';
        html += '<div><label class="text-xs text-gray-500">Hasta</label><input type="time" id="bl-to" class="w-full border rounded-xl px-3 py-2 text-sm"></div>';
        html += '<div><button onclick="saveBloqueo()" class="w-full py-2 bg-teal-600 text-white rounded-full text-sm font-semibold">Bloquear</button></div>';
        html += '</div>';
        html += '<p class="text-xs text-gray-400 mt-2">💡 Deja Desde y Hasta vacíos para bloquear todo el día</p>';
        html += '</div>';

        if (blocked.length === 0) {
            html += '<div class="text-center py-8 text-gray-400">No hay bloqueos registrados</div>';
        } else {
            html += '<div class="card p-4"><h3 class="font-bold text-gray-800 mb-3">Bloqueos activos</h3>';
            html += '<div class="space-y-2">';
            for (var i = 0; i < blocked.length; i++) {
                var b = blocked[i];
                var docName = '';
                for (var j = 0; j < doctors.length; j++) {
                    if (doctors[j].id === b.doctor_id) { docName = doctors[j].name; break; }
                }
                var dateStr = b.block_date ? new Date(b.block_date + 'T12:00:00').toLocaleDateString('es-DO') : '—';
                var timeStr = (b.start_time || 'Todo el día') + (b.end_time ? ' — ' + b.end_time : '');
                var who = docName || 'Toda la clínica';
                html += '<div class="flex items-center justify-between p-3 bg-orange-50 rounded-xl">';
                html += '<div><p class="font-medium text-sm">' + dateStr + ' — ' + timeStr + '</p><p class="text-xs text-gray-500">' + who + '</p></div>';
                html += '<button onclick="deleteBloqueo(' + b.id + ')" class="text-red-500 text-sm">🗑️</button>';
                html += '</div>';
            }
            html += '</div></div>';
        }
        html += '</div>';

        return html;
    }

    window.saveBloqueo = async function() {
        var date = document.getElementById('bl-date').value;
        if (!date) { alert('Selecciona una fecha'); return; }
        await api('/api/blocked-schedules', { method: 'POST', body: JSON.stringify({
            doctor_id: document.getElementById('bl-doctor').value || null,
            block_date: date,
            start_time: document.getElementById('bl-from').value,
            end_time: document.getElementById('bl-to').value,
        })});
        renderPage();
    };
    window.deleteBloqueo = async function(id) {
        if (!confirm('¿Eliminar este bloqueo?')) return;
        await api('/api/blocked-schedules/' + id, { method: 'DELETE' });
        renderPage();
    };
</script>
</body>
